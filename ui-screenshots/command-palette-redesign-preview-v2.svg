  <path d="M1118 274V277.5M1118 280H1118.1" stroke="#73B4C7" stroke-width="1.35" stroke-linecap="round"/>
  <text x="1138" y="281" fill="#D1DADD" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Guide &amp; Shortcuts</text>

