  <text x="539" y="23" fill="#888F92" font-family="Segoe UI, Arial, sans-serif" font-size="12">jaip</text>
  <rect y="39" width="360" height="821" fill="#181A1C"/>
  <path d="M360 39V860M0 860H1600" stroke="#2A2D2F"/>
