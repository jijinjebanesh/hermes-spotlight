  <text x="88" y="133" fill="#AEB4B6" font-family="Segoe UI, Arial, sans-serif" font-size="12">⌄　ui-screenshots</text>
  <g fill="#9DA5A8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    <text x="105" y="165">nous-flow-turn-1.png</text><text x="105" y="192">nous-flow-turn-2.png</text>
    <text x="105" y="219">nous-flow-turn-3.png</text><text x="105" y="246">skill-usage-redesign.svg</text>
