      <stop stop-color="#17191B"/>
      <stop offset="1" stop-color="#101214"/>
    </linearGradient>
    <filter id="panelShadow" x="1060" y="39" width="520" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Quiet editor context, matching the compact floating overlay use case. -->
  <rect width="1600" height="900" rx="10" fill="#101214"/>
