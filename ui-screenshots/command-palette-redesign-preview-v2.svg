  <text x="389" y="65" fill="#D3D6D7" font-family="Segoe UI, Arial, sans-serif" font-size="13">Welcome</text>
  <text x="503" y="65" fill="#858C8F" font-family="Segoe UI, Arial, sans-serif" font-size="13">Codex Diff</text>
  <text x="448" y="255" fill="#D2D5D6" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="550">Visual Studio Code</text>
  <text x="450" y="287" fill="#90989B" font-family="Segoe UI, Arial, sans-serif" font-size="17">Editing evolved</text>
