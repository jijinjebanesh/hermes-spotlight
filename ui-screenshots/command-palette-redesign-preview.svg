      <rect x="418" y="661" width="31" height="15" rx="4" fill="#26363D" stroke="#50616A" stroke-opacity=".65"/><text x="433.5" y="672" text-anchor="middle" fill="#D2DEE2" font-size="8.5">esc</text><text x="455" y="672">close</text>
