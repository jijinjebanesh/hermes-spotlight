    <circle cx="269.5" cy="403.5" r="7" stroke="#78BFD4" stroke-width="1.5"/>
    <path d="M269.5 400.5V404M269.5 407H269.55" stroke="#78BFD4" stroke-width="1.6" stroke-linecap="round"/>
