    <text x="777" y="586" text-anchor="end" fill="#71868E" font-family="Segoe UI, Arial, sans-serif" font-size="9.5">Yesterday</text>

    <rect x="256" y="611" width="27" height="27" rx="8" fill="#1B2B31"/>
    <path d="M262 617.5H277V628.5H267L263.5 632V628.5H262V617.5Z" stroke="#718A94" stroke-width="1.3" stroke-linejoin="round"/>
    <text x="294" y="627" fill="#C2D0D6" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Fix settings theme and contrast</text>
    <text x="777" y="627" text-anchor="end" fill="#71868E" font-family="Segoe UI, Arial, sans-serif" font-size="9.5">Yesterday</text>

    <!-- Keyboard footer -->
    <path d="M227 650H813" stroke="#C6D9DF" stroke-opacity=".11"/>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#91A5AD">
      <rect x="250" y="661" width="27" height="15" rx="4" fill="#26363D" stroke="#50616A" stroke-opacity=".65"/><text x="263.5" y="672" text-anchor="middle" fill="#D2DEE2" font-size="8.5">↑↓</text><text x="283" y="672">navigate</text>
